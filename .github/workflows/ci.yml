name: M0 gates

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  m0:
    name: build, lint, unit, profiles
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install C++ tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-18 libcurl4-openssl-dev
          python -m pip install "cmake>=3.24,<4" "ninja>=1.11,<2"

      - name: Sync Python tooling
        run: uv sync --locked --group dev

      - name: Run M0 positive gates
        env:
          CC: clang-18
          CXX: clang++-18
        run: make m0-check

      - name: Verify every C++ build profile
        env:
          CC: clang-18
          CXX: clang++-18
        run: make cpp-profiles-check

  gate-proof:
    name: gate proof - ${{ matrix.proof }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        proof:
          - cpp-warning-as-error
          - cpp-unit-test
          - cpp-format
          - python-unit-test
          - python-lint
          - python-format
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install C++ tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-18 libcurl4-openssl-dev
          python -m pip install "cmake>=3.24,<4" "ninja>=1.11,<2"

      - name: Sync locked tooling
        run: uv sync --locked --group dev

      - name: Prove violation reaches the CI aggregate
        env:
          CC: clang-18
          CXX: clang++-18
        run: make m0-gate-proof PROOF=${{ matrix.proof }}
