name: M0 gates

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  m0:
    name: build, lint, unit, gate-proof
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install C++ tools
        run: python -m pip install "cmake>=3.24,<4" "ninja>=1.11,<2"

      - name: Sync Python tooling
        run: uv sync --group dev

      - name: Run M0 positive gates
        run: make m0-check

      - name: Prove representative gate failures
        run: make m0-gate-proof
