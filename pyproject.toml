[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "chronos-engine"
version = "0.0.1"
description = "Local-first, replay-first crypto market decision and research engine."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }
authors = [
  { name = "Theta Chronos contributors" },
]
dependencies = []

[dependency-groups]
dev = [
  "clang-format==18.1.8",
  "hatchling==1.27.0",
  "pytest>=8.3,<9",
  "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["python/chronos"]

[tool.hatch.build.targets.sdist]
include = [
  "/README.md",
  "/pyproject.toml",
  "/python/chronos",
  "/contracts/conformance/fixtures",
  "/tests/python",
  "/tools/development/bootstrap_m0.py",
  "/tools/development/generate_strategy_definition.py",
  "/tools/development/verify_m5_authority_boundaries.py",
  "/tools/development/verify_m6_authority_boundaries.py",
  "/tools/development/verify_m6_risk_authority_boundaries.py",
  "/tools/development/verify_strategy_capabilities.py",
  "/tools/development/verify_strategy_symbols.py",
]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
addopts = [
  "--strict-config",
  "--strict-markers",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "B",
]
